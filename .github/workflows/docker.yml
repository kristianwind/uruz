name: Build og udgiv container-image

# Bygger Uruz-imaget og skubber det til GitHub Container Registry, så
# Yggdrasil-runen kan hente det med `ghcr.io/kristianwind/uruz:latest`.
#
# Multi-arch er ikke pynt: en Mac bygger arm64, mens de fleste servere kører
# amd64. Uden begge dele fejler containeren med "exec format error".

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "website/**"
      - "**/*.md"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/uruz

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Sæt QEMU op (til arm64-bygget)
        uses: docker/setup-qemu-action@v3

      - name: Sæt Buildx op
        uses: docker/setup-buildx-action@v3

      - name: Log ind på GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Udled tags og labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Byg og skub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
