# Uruz ᚢ — a Rune for Yggdrasil Panel
#
# Carve it into the panel with Runes → Carve a rune (upload), or point
# Runes → Browse GitHub at this folder.
#
# Container pattern A: Uruz owns the command. Yggdrasil clears the entrypoint
# and runs the app as the panel's uid:gid, so everything the app writes stays
# editable from the Files tab.
#
# `data_path: /data` is deliberate even though /data is already the default —
# setting it makes Yggdrasil leave the working directory alone, so the image's
# own WORKDIR (/app) applies and `node server.js` resolves correctly.

gameskill:
  id: uruz
  name: "Uruz"
  category: "Apps"
  description: "Styrketræning med offline-logning, statistik og AI-coach (Mimir). PWA til iPhone og web."
  author: "kristianwind"
  version: 2
  icon: "app"

  docker:
    image: "ghcr.io/kristianwind/uruz:latest"
    data_path: /data

  variables:
    # ---- Adressen appen kender sig selv på -------------------------------
    - key: NEXT_PUBLIC_APP_URL
      name: "Offentlig adresse (valgfri)"
      type: string
      default: ""
      required: false
      # Bruges til login-links i e-mails og som WebAuthn origin. Lades den tom,
      # udleder appen adressen af forespørgslen (x-forwarded-host), hvilket er
      # rigtigt bag panelets proxy. Sæt den kun hvis du vil låse den fast, fx
      # https://uruz.dit-domæne.dk — en sat adresse vinder altid.
      #
      # Defaulten var før "http://localhost:3000", og den værdi blev siddende
      # på servere oprettet dengang: den gjorde både login-links og Face ID
      # ubrugelige. Tom er nu det ærlige svar.

    - key: WEBAUTHN_RP_ID
      name: "Passkey-domæne (lad stå tom)"
      type: string
      default: ""
      # Udledes automatisk af adressen ovenfor. Sæt den kun hvis du bevidst vil
      # dele én passkey på tværs af underdomæner (fx "dit-domæne.dk"), og husk
      # at den så skal være et ægte overdomæne til adressen.

    # ---- Mimir (AI-coach) — helt valgfrit --------------------------------
    - key: AI_PROVIDER
      name: "AI-udbyder"
      type: select
      options: [none, custom, ollama, anthropic, openai, google]
      default: none
      # "custom" dækker enhver OpenAI-kompatibel server (llama.cpp, LM Studio,
      # vLLM …). Uden model coacher appen videre på regelbaserede forslag.

    - key: AI_BASE_URL
      name: "AI-adresse"
      type: string
      default: ""
      # Fx http://192.168.1.150:8080/v1 — lad stå tom for skytjenester.

    - key: AI_MODEL
      name: "AI-model"
      type: string
      default: ""

    - key: AI_API_KEY
      name: "AI-nøgle"
      type: string
      default: ""
      secret: true

    - key: AI_DISABLE_THINKING
      name: "Slå modellens 'tænkning' fra (hurtigere)"
      type: bool
      default: true

    # ---- Notifikationer -------------------------------------------------
    - key: NEXT_PUBLIC_VAPID_PUBLIC_KEY
      name: "VAPID public key (web push)"
      type: string
      default: ""
      # Lav et nøglepar med: npm run gen:vapid

    - key: VAPID_PRIVATE_KEY
      name: "VAPID private key"
      type: string
      default: ""
      secret: true

    - key: VAPID_SUBJECT
      name: "VAPID kontakt (mailto:)"
      type: string
      default: "mailto:admin@uruz.local"

    # ---- E-mail (login-links, invitationer og reminders) -----------------
    # Udfyld enten SMTP eller Resend. SMTP vinder hvis begge er sat. Er ingen
    # af dem sat, skrives beskederne i serverens log — nok til at komme i gang,
    # men husk at alle med adgang til loggen så kan læse login-links.
    - key: SMTP_HOST
      name: "SMTP-server"
      type: string
      default: ""
      # Fx smtp.dit-domæne.dk eller smtp.gmail.com

    - key: SMTP_PORT
      name: "SMTP-port"
      type: string
      default: "587"
      # 587 (STARTTLS) er det almindelige. 465 er implicit TLS.

    - key: SMTP_USER
      name: "SMTP-brugernavn"
      type: string
      default: ""

    - key: SMTP_PASSWORD
      name: "SMTP-kodeord"
      type: string
      default: ""
      secret: true

    - key: SMTP_SECURE
      name: "Tving TLS (lad stå tom)"
      type: string
      default: ""
      # Udledes af porten. Sæt kun true/false hvis din server er speciel.

    - key: RESEND_API_KEY
      name: "Resend API-nøgle (alternativ til SMTP)"
      type: string
      default: ""
      secret: true

    - key: EMAIL_FROM
      name: "Afsender-adresse"
      type: string
      default: "Uruz <ravne@uruz.local>"
      # Mange udbydere afviser en afsender de ikke mener er din — sæt den til
      # en adresse på det domæne du sender fra.

    # ---- Baggrundsjob ----------------------------------------------------
    # Appen kører selv sit baggrundsjob (reminders m.m.) hvert kvarter —
    # der skal ikke sættes noget op for at ravnene flyver.
    - key: CRON_SECRET
      name: "Cron-hemmelighed (valgfri)"
      type: string
      default: ""
      secret: true
      # Beskytter /api/cron — kun nødvendig hvis en EKSTERN scheduler skal
      # kunne kalde endpointet. Uden den nægter endpointet at køre.

    - key: URUZ_SCHEDULER
      name: "Indbygget scheduler (lad stå tom)"
      type: string
      default: ""
      # Tom = til i produktion. Sæt "0" hvis en ekstern cron kalder /api/cron
      # og du vil have præcis én afsender.

  install:
    script: |
      mkdir -p /data
      echo "Uruz: datamappe klar. Databasen oprettes ved første start."

  startup:
    # PORT er containersiden; Yggdrasil publicerer den på en fri værtsport.
    command: "exec node server.js"
    done_regex: 'Ready in|started server on'
    stop_timeout: 20

  ports:
    - { name: web, default: 3000, protocol: tcp }

  backup:
    # Hele datamappen er databasen plus dens WAL-filer.
    include: ["."]
